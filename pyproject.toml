[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "envleak-cli"
version = "0.1.0"
description = "Find exposed API keys and secrets before someone else does. 100% local."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
keywords = ["security", "secrets", "api-keys", "ai-agents", "llm", "devsecops"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/novasdiego1/envleak"
Issues = "https://github.com/novasdiego1/envleak/issues"

[project.scripts]
envleak = "envleak.cli:_entry"

[tool.hatch.build.targets.wheel]
packages = ["envleak"]
